[versions]
# otel: pinned at 1.42.0 — reviewed at M1.8 per ADR-0011 (drafted in Plan 03-05);
# latest stable on Maven Central is 1.63.0 (21 minor versions ahead). Bump deferred
# to M2 — outside the M1.8 release-cut window. The cross-cut spans
# opentelemetry-api / sdk / sdk-logs / exporter-otlp AND the instrumentation BOM
# (today 2.10.0-alpha; latest 2.29.0-alpha), and would force re-verification of
# OtlpExporter + BeaconLogbackAppender against post-1.42 API/SPI shifts —
# scope that does not fit a milestone-cut plan. See
# docs/adr/0011-otel-sdk-version-policy.md for the policy
# (review at every milestone; bump-or-justify).
otel = "1.42.0"
otelInstrumentation = "2.10.0-alpha"
junit = "5.11.0"
jsonSchema = "1.5.0"
snakeyaml = "2.3"
assertj = "3.26.3"
slf4j = "2.0.16"
logback = "1.5.12"
springContext = "6.1.14"
jmh = "1.37"
jmhPlugin = "0.7.2"
springBoot = "3.3.5"
jacksonDatabind = "2.18.0"
spotless = "7.0.2"
# M3.0b (Phase 5.1) — ingest gateway OTLP wire. opentelemetry-proto ships the OTLP
# protobuf messages + generated gRPC LogsService stubs; its runtime is protobuf-java
# 4.34.0 (its POM pins it), which wins over grpc-bom's slightly-lower protobuf so the
# generated-code/runtime version check is satisfied. grpc-bom 1.82.1 targets protobuf
# 4.x and supplies grpc-netty-shaded/stub/protobuf versions. See docs/adr/0025.
otelProto = "1.10.0-alpha"
grpc = "1.82.1"

[plugins]
jmh = { id = "me.champeau.jmh", version.ref = "jmhPlugin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.6" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

[libraries]
otel-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "otel" }
otel-sdk = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "otel" }
otel-sdk-logs = { module = "io.opentelemetry:opentelemetry-sdk-logs", version.ref = "otel" }
otel-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp", version.ref = "otel" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchema" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
otel-logback-appender = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "otelInstrumentation" }
spring-context = { module = "org.springframework:spring-context", version.ref = "springContext" }
# M1.8 — SeverityMapper loads contract/spec/severity-table.json at class init
# (Jackson required on the SDK main classpath). Aligned with Spring Boot 3.3.5 jackson-bom.
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jacksonDatabind" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }

# Spring Boot 3.x — consumed by :beacon-spring-boot-starter (M1.7 Plan 02-02).
# Runs on Java 17; aligns with our JavaLanguageVersion.of(17) toolchain.
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "springBoot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "springBoot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springBoot" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "springBoot" }

# M3.0b (Phase 5.1) — ingest gateway. Boot starters pinned to the same springBoot ref
# as the adapter; spring-kafka / micrometer / testcontainers versions are supplied by
# the Spring Boot BOM (imported automatically when the spring-boot plugin is applied).
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "springBoot" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "springBoot" }

# OTLP wire — messages + gRPC stubs (otelProto) and the gRPC runtime (grpc-bom).
# grpc modules carry no explicit version: platform(libs.grpc.bom) aligns them.
otel-proto = { module = "io.opentelemetry.proto:opentelemetry-proto", version.ref = "otelProto" }
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded" }
grpc-stub = { module = "io.grpc:grpc-stub" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf" }
