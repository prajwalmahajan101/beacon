[project]
name = "beacon-sdk"
version = "0.3.0.dev0"   # milestone-semver, milestone-m2 dev
description = "Beacon SDK for Python — OTel-aligned logs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Beacon contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Logging",
]
dependencies = [
  # ADR-0013: OTel Python SDK pin for M2 — see docs/adr/0013-otel-python-sdk-version-pin-m2.md
  "opentelemetry-api == 1.43.0",
  # ADR-0013: OTel Python SDK pin for M2 — see docs/adr/0013-otel-python-sdk-version-pin-m2.md
  "opentelemetry-sdk == 1.43.0",
  # ADR-0013: OTel Python SDK pin for M2 — see docs/adr/0013-otel-python-sdk-version-pin-m2.md
  "opentelemetry-exporter-otlp == 1.43.0",
]

[project.urls]
Source = "https://github.com/beacon/beacon/tree/main/beacon-sdk-python"

[dependency-groups]
# PEP 735 — uv's preferred location for dev deps (NOT [tool.uv.dev-dependencies]).
dev = [
  "pytest >= 8.2",
  "pytest-html >= 4.1",
  "jsonschema >= 4.23",
  "pyyaml >= 6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon"]

[tool.uv]
# (Intentionally minimal — uv defaults are correct for src-layout + editable project root.)
