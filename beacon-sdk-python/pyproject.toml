[project]
name = "beacon-sdk"
version = "0.3.0.dev0"   # milestone-semver, milestone-m2 dev
description = "Beacon SDK for Python — OTel-aligned logs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Beacon contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Logging",
]
dependencies = [
  # ADR-0013: OTel Python SDK pin for M2 — see docs/adr/0013-otel-python-sdk-version-pin-m2.md
  "opentelemetry-api == 1.43.0",
  # ADR-0013: OTel Python SDK pin for M2 — see docs/adr/0013-otel-python-sdk-version-pin-m2.md
  "opentelemetry-sdk == 1.43.0",
  # ADR-0013: OTel Python SDK pin for M2 — see docs/adr/0013-otel-python-sdk-version-pin-m2.md
  "opentelemetry-exporter-otlp == 1.43.0",
]

[project.urls]
Source = "https://github.com/beacon/beacon/tree/main/beacon-sdk-python"

[dependency-groups]
# PEP 735 — uv's preferred location for dev deps (NOT [tool.uv.dev-dependencies]).
dev = [
  "pytest >= 8.2",
  "pytest-html >= 4.1",
  "jsonschema >= 4.23",
  "pyyaml >= 6.0.2",
  "ruff >= 0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon"]

[tool.uv]
# (Intentionally minimal — uv defaults are correct for src-layout + editable project root.)

# ADR-0012 (Java CI floor) idiom in Python: ruff SUBSUMES flake8 (E/F), isort (I),
# pyupgrade (UP), bugbear (B) and pydocstyle (D) — one tool, no separate pydocstyle/darglint.
[tool.ruff]
target-version = "py310"   # matches requires-python >=3.10 + locked decision #2 (3.10 floor)
line-length = 100          # single documented width (modern default; not bikeshed)
src = ["src", "tests"]     # first-party roots so isort (I) orders imports correctly

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
# D1xx "missing docstring" ignores: this is a floor, not a docstring-writing marathon
# (Pitfall #22 — do not gold-plate). D100 module / D104 package / D107 __init__ docstrings
# are not required across the existing (non-docstring-heavy) codebase.
ignore = ["D100", "D104", "D107"]

[tool.ruff.lint.per-file-ignores]
# Test functions/methods are self-documenting via their names + arrange/act/assert
# bodies; requiring a docstring on every test is the "docstring marathon" the floor
# explicitly avoids (Pitfall #22). D102/D103 stay enforced on src/ (the public API).
"tests/**" = ["D101", "D102", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"      # consistent docstring style for the D rules (vs full-pedantic default)
