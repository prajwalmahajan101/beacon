name: python-sdk

on:
  push:
    branches: [main]
    paths:
      - "beacon-sdk-python/**"
      - "examples/python-sample/**"
      - "beacon-s0-contract/conformance/python/**"
      - "beacon-s0-contract/spec/severity-table.json"
      - "beacon-s0-contract/conformance/config-keys.yaml"
      - "beacon-s0-contract/schema/**"
      - ".github/workflows/python-sdk.yml"
  pull_request:
    branches: [main]
    paths:
      - "beacon-sdk-python/**"
      - "examples/python-sample/**"
      - "beacon-s0-contract/conformance/python/**"
      - "beacon-s0-contract/spec/severity-table.json"
      - "beacon-s0-contract/conformance/config-keys.yaml"
      - "beacon-s0-contract/schema/**"
      - ".github/workflows/python-sdk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Python SDK build + conformance harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10 (floor)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: uv sync (locked)
        working-directory: beacon-sdk-python
        run: uv sync --frozen

      # ADR-0012 (Java CI floor) idiom in Python — three BLOCKING gates that fail the
      # build on any finding (no continue-on-error). Placed before the test suite to
      # fail fast on style/type before running tests. Landed GREEN on the first gated
      # run because Plans 01-02 made the tree ruff-clean + mypy --strict-clean.
      - name: Ruff lint (gate)
        working-directory: beacon-sdk-python
        run: uv run ruff check src tests

      - name: Ruff format (gate)
        working-directory: beacon-sdk-python
        run: uv run ruff format --check src tests

      - name: Mypy strict (gate)
        working-directory: beacon-sdk-python
        run: uv run mypy --strict src

      - name: Unit tests (HTML report + coverage)
        working-directory: beacon-sdk-python
        # --cov is REPORT-ONLY (no threshold gate; mirrors Java JaCoCo, ADR-0012 §2).
        run: uv run pytest tests/ -v --html=pytest-report.html --self-contained-html --cov --cov-report=html:htmlcov --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload pytest HTML report
        # if: always() so the report uploads even when the suite fails.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-pytest-report
          path: beacon-sdk-python/pytest-report.html

      - name: Upload coverage report
        # Report-only coverage artifact (mirrors Java jacoco-coverage-report, ADR-0012 §2);
        # if: always() so it uploads even when the suite fails. NO threshold check.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-coverage-report
          path: |
            beacon-sdk-python/htmlcov
            beacon-sdk-python/coverage.xml

      - name: Conformance harness (C1–C12 green)
        working-directory: beacon-sdk-python
        run: uv run python -m pytest ../beacon-s0-contract/conformance/python -v

      - name: Cross-SDK contract-drift check (Python introspection)
        # check_contract_drift.py imports PyYAML; the bare runner python has no
        # third-party deps, so install it explicitly (mirrors contract.yml).
        run: |
          python3 -m pip install --quiet pyyaml
          python3 beacon-s0-contract/conformance/tools/check_contract_drift.py --sdk python

      - name: Run python-sample (integration smoke)
        # Makes examples/python-sample/ a CI-verified integration artifact: uv run
        # propagates the script's exit code, so a broken sample fails CI. No
        # collector runs here, so the sample emits via the stderr/file fallback
        # (Plan 02) — exit 0 is the pass condition (stderr content is NOT gated).
        working-directory: examples/python-sample
        run: uv run --with ../../beacon-sdk-python python main.py
