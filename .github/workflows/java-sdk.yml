name: java-sdk

on:
  push:
    branches: [main]
    paths:
      - "sdk/java/core/**"
      - "sdk/java/spring-adapter/**"
      - "sdk/java/benchmark/**"
      - "contract/conformance/java/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/java-sdk.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdk/java/core/**"
      - "sdk/java/spring-adapter/**"
      - "sdk/java/benchmark/**"
      - "contract/conformance/java/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/java-sdk.yml"

jobs:
  build:
    name: Build + conformance harness (disabled-test report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless check (google-java-format)
        run: ./gradlew spotlessCheck --no-daemon

      - name: Build (assemble + test)
        run: ./gradlew build --no-daemon

      - name: Set up Python (for contract-drift check)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyyaml
        run: pip install pyyaml==6.0.2

      - name: Run cross-SDK contract-drift checker
        run: python3 contract/conformance/tools/check_contract_drift.py --sdk java

      - name: Verify benchmark subproject compiles
        run: ./gradlew :beacon-sdk-java-benchmark:compileJmhJava --no-daemon

      - name: Javadoc compile gate (-Werror)
        run: ./gradlew :beacon-sdk-java:javadoc :beacon-sdk-spring-adapter:javadoc --no-daemon

      - name: Surface conformance test report
        if: always()
        run: |
          report_dir=contract/conformance/java/build/reports/tests/test
          if [ -d "$report_dir" ]; then
            echo "Conformance HTML report at: $report_dir/index.html"
            ls -la "$report_dir"
          else
            echo "No conformance test report found at $report_dir"
            exit 1
          fi

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-test-report
          path: contract/conformance/java/build/reports/tests/test
          if-no-files-found: ignore

      - name: Upload JaCoCo HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: |
            sdk/java/core/build/reports/jacoco/test/html
            sdk/java/spring-adapter/build/reports/jacoco/test/html
            sdk/java/benchmark/build/reports/jacoco/test/html
            contract/conformance/java/build/reports/jacoco/test/html
          if-no-files-found: ignore

      - name: Upload JUnit HTML test report (SDK + starter)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-html-report
          path: |
            sdk/java/core/build/reports/tests/test
            sdk/java/spring-adapter/build/reports/tests/test
          if-no-files-found: ignore
