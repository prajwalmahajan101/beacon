name: java-sdk

on:
  push:
    branches: [main]
    paths:
      - "beacon-sdk-java/**"
      - "beacon-spring-boot-starter/**"
      - "beacon-sdk-java-benchmark/**"
      - "beacon-s0-contract/conformance/java/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/java-sdk.yml"
  pull_request:
    branches: [main]
    paths:
      - "beacon-sdk-java/**"
      - "beacon-spring-boot-starter/**"
      - "beacon-sdk-java-benchmark/**"
      - "beacon-s0-contract/conformance/java/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/java-sdk.yml"

jobs:
  build:
    name: Build + conformance harness (disabled-test report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless check (google-java-format)
        run: ./gradlew spotlessCheck --no-daemon

      - name: Build (assemble + test)
        run: ./gradlew build --no-daemon

      - name: Set up Python (for contract-drift check)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyyaml
        run: pip install pyyaml==6.0.2

      - name: Run cross-SDK contract-drift checker
        run: python3 beacon-s0-contract/conformance/tools/check_contract_drift.py --sdk java

      - name: Verify benchmark subproject compiles
        run: ./gradlew :beacon-sdk-java-benchmark:compileJmhJava --no-daemon

      - name: Javadoc compile gate (-Werror)
        run: ./gradlew :beacon-sdk-java:javadoc :beacon-spring-boot-starter:javadoc --no-daemon

      - name: Surface conformance test report
        if: always()
        run: |
          report_dir=beacon-s0-contract/conformance/java/build/reports/tests/test
          if [ -d "$report_dir" ]; then
            echo "Conformance HTML report at: $report_dir/index.html"
            ls -la "$report_dir"
          else
            echo "No conformance test report found at $report_dir"
            exit 1
          fi

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-test-report
          path: beacon-s0-contract/conformance/java/build/reports/tests/test
          if-no-files-found: ignore

      - name: Upload JUnit HTML test report (SDK + starter)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-html-report
          path: |
            beacon-sdk-java/build/reports/tests/test
            beacon-spring-boot-starter/build/reports/tests/test
          if-no-files-found: ignore
