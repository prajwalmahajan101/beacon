spring:
  application:
    name: beacon-gateway
  kafka:
    # Docker-compose wires BEACON_KAFKA_BOOTSTRAP=kafka:29092 (the DOCKER listener);
    # local dev defaults to the HOST listener on localhost:9092.
    bootstrap-servers: ${BEACON_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      # Idempotent, durable producer (INGEST-04). enable.idempotence=true REQUIRES
      # acks=all, retries>0, and max.in.flight<=5 — Kafka rejects the producer otherwise.
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Bound the client-side send so a wedged broker cannot pin a request thread past
        # the gateway's own produce-timeout-ms; keep it >= produce-timeout-ms.
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        # Bound the metadata wait inside send() so an unreachable broker fails fast (→ 5xx)
        # instead of blocking the request thread for the 60s default.
        max.block.ms: 5000

server:
  # OTLP/HTTP transport (T7). The OTLP/gRPC transport binds beacon.gateway.grpc-port
  # on a standalone Netty server (T8), NOT this embedded Tomcat.
  port: 4318

management:
  server:
    # Actuator on a separate port so /health is never exposed on the OTLP data plane.
    port: 9464
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

beacon:
  gateway:
    grpc-port: 4317
    kafka:
      topic: ${BEACON_KAFKA_TOPIC:beacon.logs}
      produce-timeout-ms: 5000
