# M3.0c+M3.1 — Kafka -> Elasticsearch indexer with DLQ routing.
#
# Consumes canonical M0 JSON produced by the gateway on the `beacon.logs` topic.
# Valid JSON records are bulk-written to the `beacon-logs` ES index. Records that
# fail JSON decode (poison records injected directly into Kafka, bypassing the
# gateway validator) are routed to BOTH `beacon.logs.dlq` Kafka topic AND the
# `beacon-logs-rejected` ES index for operational visibility (INGEST-08, INGEST-14).
#
# End-to-end acknowledgements are enabled on the ES sink so Vector holds Kafka
# offset commits until ES confirms the write (INGEST-07 prep).

api:
  enabled: true
  address: "0.0.0.0:8686"

sources:
  internal_metrics:
    type: internal_metrics

  logs_in:
    type: kafka
    bootstrap_servers: "kafka:29092"
    topics: ["beacon.logs"]
    group_id: "beacon-indexer"
    auto_offset_reset: "earliest"
    decoding:
      codec: bytes
    headers_key: "kafka_headers"

transforms:
  parse_json:
    type: remap
    inputs: ["logs_in"]
    source: |
      raw = string!(.message)
      parsed, err = parse_json(raw)
      if err != null {
        # Poison record — keep raw message + error metadata for DLQ routing.
        .raw_message = raw
        .error = to_string(err)
        .dlq_reason = "json_decode_failure"
        del(.message)
      } else {
        # Valid M0 JSON — replace the entire event with the parsed record,
        # stripping Kafka metadata (topic/partition/offset) that log_namespace:false adds.
        # Preserve tenant header before overwriting the event.
        tenant_id = .kafka_headers."X-Scope-OrgID" ?? null
        . = parsed
        if tenant_id != null {
          .tenant_id = tenant_id
        }
      }

  route_valid:
    type: filter
    inputs: ["parse_json"]
    condition: '!exists(.dlq_reason)'

  route_dlq:
    type: filter
    inputs: ["parse_json"]
    condition: 'exists(.dlq_reason)'

sinks:
  es_out:
    type: elasticsearch
    inputs: ["route_valid"]
    endpoints: ["http://elasticsearch:9200"]
    api_version: "v8"
    mode: "bulk"
    bulk:
      index: "beacon-logs"
    healthcheck:
      enabled: false
    acknowledgements:
      enabled: true

  dlq_kafka:
    type: kafka
    inputs: ["route_dlq"]
    bootstrap_servers: "kafka:29092"
    topic: "beacon.logs.dlq"
    encoding:
      codec: json

  dlq_es:
    type: elasticsearch
    inputs: ["route_dlq"]
    endpoints: ["http://elasticsearch:9200"]
    api_version: "v8"
    mode: "bulk"
    bulk:
      index: "beacon-logs-rejected"
    healthcheck:
      enabled: false
